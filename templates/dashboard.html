{% extends 'base.html' %}
{% block content %}
<h2 class="text-2xl font-bold mb-4">Team Dashboard</h2>
<p class="mb-6">Welcome, <span class="font-semibold">{{ team.name }}</span></p>

<h3 class="text-xl font-semibold mb-2">Upload Original</h3>
<form action="/originals" method="post" enctype="multipart/form-data" class="space-y-2 mb-6">
    <input id="audioInput" type="file" name="file" accept="audio/*" capture required class="block">
    <input type="text" name="note" placeholder="note" class="border rounded p-2 w-full">
    <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded">Upload</button>
</form>
<audio id="audioPreview" controls class="w-full mt-2 hidden"></audio>
<script>
    const input = document.getElementById('audioInput');
    const preview = document.getElementById('audioPreview');
    input.addEventListener('change', () => {
        const file = input.files[0];
        if (file) {
            preview.src = URL.createObjectURL(file);
            preview.classList.remove('hidden');
        } else {
            preview.src = '';
            preview.classList.add('hidden');
        }
    });
</script>

<h3 class="text-xl font-semibold mb-2">Originals</h3>
<ul class="space-y-4">
{% for orig in originals %}
    <li class="border rounded p-2 bg-white">
        <div class="mb-1 font-semibold">{{ orig.note or "Original " ~ orig.id }}</div>
        <audio controls src="/{{ orig.filepath }}" class="w-full"></audio>
    </li>
{% endfor %}
</ul>
{% endblock %}
