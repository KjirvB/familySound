{% extends 'base.html' %}
{% block content %}
<h2 class="text-2xl font-bold mb-4">Change Team Password</h2>
{% if success %}
<p class="text-green-600 font-semibold mb-4">Password updated successfully.</p>
{% endif %}
<form action="/jury/password" method="post" class="space-y-4">
    <div>
        <label class="block font-semibold mb-1">Team</label>
        <select name="team_id" class="border rounded p-2 w-full">
            {% for team in teams %}
            <option value="{{ team.id }}">{{ team.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div>
        <label class="block font-semibold mb-1">New Password</label>
        <input type="password" name="password" class="border rounded p-2 w-full" required>
    </div>
    <button type="submit" class="bg-red-500 text-white px-4 py-2 rounded">Update</button>
</form>
{% endblock %}
