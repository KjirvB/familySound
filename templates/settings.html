{% extends 'base.html' %}
{% block content %}
<h2 class="text-2xl font-bold mb-4">Settings</h2>
{% if success %}
<p class="text-green-600 font-semibold mb-4">Settings updated.</p>
{% endif %}
<form action="/jury/settings" method="post" class="space-y-4">
    <div>
        <label class="block font-semibold mb-1">Max originals per team</label>
        <input type="number" name="max_originals" value="{{ max_originals }}" class="border rounded p-2 w-full" required min="1">
    </div>
    <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded">Save</button>
</form>
{% endblock %}
