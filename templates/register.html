{% extends 'base.html' %}
{% block content %}
<h2 class="text-2xl font-bold mb-4">Register Team</h2>
<form action="/register" method="post" class="space-y-4">
    <div>
        <label class="block font-semibold mb-1">Registration Key</label>
        <input type="password" name="reg_key" class="border rounded p-2 w-full" required>
    </div>
    <div>
        <label class="block font-semibold mb-1">Team Name</label>
        <input type="text" name="name" class="border rounded p-2 w-full" required>
    </div>
    <div>
        <label class="block font-semibold mb-1">Password</label>
        <input type="password" name="password" class="border rounded p-2 w-full" required>
    </div>
    <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded">Register</button>
</form>
{% endblock %}
